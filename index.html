<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Botmon</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f16;
      --card: #151a24;
      --card-hover: #1b2230;
      --text: #e8edf5;
      --muted: #8b97a9;
      --accent: #ffd23c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ---------- Top bar ---------- */
    .topbar {
      padding: 16px 24px;
      border-bottom: 1px solid #1f2734;
      background: linear-gradient(180deg, #121826, #0b0f16);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo { font-weight: 700; font-size: 18px; letter-spacing: 0.5px; }

    /* ---------- Hero ---------- */
    .hero { text-align: center; padding: 40px 16px 24px; }

    .hero h1 {
      font-size: 42px;
      letter-spacing: -1px;
      background: linear-gradient(90deg, var(--accent), #7cc7ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p { color: var(--muted); margin-top: 6px; }

    /* ---------- Grid ---------- */
    main { padding: 0 24px 48px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* ---------- Card ---------- */
    .card {
      background: var(--card);
      border: 1px solid #202a38;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      padding: 0;
      color: inherit;
      font: inherit;
      text-align: left;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #33415c;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .card-image {
      position: relative;
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
    }

    .card-image img { width: 82%; height: 82%; object-fit: contain; }

    .card-id {
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    .card-body { padding: 14px 16px 16px; border-top: 1px solid #202a38; }

    .card-body h3 { font-size: 18px; margin-bottom: 8px; }

    /* ---------- Types ---------- */
    .types { display: flex; gap: 6px; flex-wrap: wrap; }

    .type-badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #0b0f16;
      padding: 3px 10px;
      border-radius: 999px;
    }

    /* ---------- Detail overlay ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 12, 0.82);
      backdrop-filter: blur(4px);
      display: none;
      place-items: center;
      padding: 24px;
      z-index: 50;
    }

    .overlay.open { display: grid; }

    .detail {
      background: var(--card);
      border: 1px solid #243145;
      border-radius: 18px;
      max-width: 720px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      position: relative;
      animation: pop 0.2s ease;
    }

    @keyframes pop { from { transform: scale(0.95); opacity: 0; } }

    .detail-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.45);
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      z-index: 5;
    }

    .detail-image {
      aspect-ratio: 1 / 1;
      position: relative;
      display: grid;
      place-items: center;
      padding: 40px;
    }

    .detail-image img { width: 100%; height: 100%; object-fit: contain; }

    .detail-body { padding: 32px 28px; display: flex; flex-direction: column; gap: 14px; }

    .detail-body h2 { font-size: 32px; }

    .detail-desc { color: var(--muted); line-height: 1.5; }

    .detail-stats { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .detail-stats li {
      background: #1b2230;
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .detail-stats span { color: var(--muted); font-size: 13px; }

    .detail-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: auto; }

    .btn { border: none; border-radius: 10px; padding: 10px 16px; font-weight: 700; cursor: pointer; color: #0b0f16; }

    .btn-ghost { background: transparent; border: 1px solid #33415c; color: var(--text); }

    /* ---------- Footer ---------- */
    .footer { text-align: center; padding: 20px; border-top: 1px solid #1f2734; color: var(--muted); font-size: 13px; }

    .footer a { color: var(--accent); text-decoration: none; }

    .footer a:hover { text-decoration: underline; }

    /* ---------- Mobile ---------- */
    @media (max-width: 640px) {
      .detail { grid-template-columns: 1fr; max-height: 90vh; overflow-y: auto; }
      .detail-image { aspect-ratio: 1 / 1; }
      .hero h1 { font-size: 32px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <span class="logo">🤖 Botmon</span>
  </header>

  <main>
    <div class="hero">
      <h1>Botmon</h1>
      <p>Explore la collection de petits robots monstres</p>
    </div>
    <div class="grid" id="grid"></div>
  </main>

  <footer class="footer">
    <p>
      Le concept Botmon est sous licence
      <a href="https://creativecommons.org/publicdomain/zero/1.0/" target="_blank" rel="noreferrer">
        Creative Commons CC0 (domaine public)
      </a>.
    </p>
  </footer>

  <div class="overlay" id="overlay">
    <div class="detail">
      <button class="detail-close" onclick="closeDetail()">✕</button>
      <div class="detail-image" id="detailImage"></div>
      <div class="detail-body" id="detailBody"></div>
    </div>
  </div>

  <script>
    const TYPE_COLORS = {
      air: '#7cc7ff',
      fire: '#ff5a3c',
      plant: '#58c95c',
      water: '#4f9dff',
      electric: '#ffd23c'
    }

    const robots = [
      {
        id: 1,
        name: 'Aerobot',
        types: ['air'],
        image: 'assets/2d/Meshy_AI_robot-air-concept.png',
        description:
          "Ce petit droid volant aspire l'air pour se propulser dans le ciel. Ses rotors silencieux font de lui un éclaireur parfait."
      },
      {
        id: 2,
        name: 'Pyrobot',
        types: ['fire'],
        image: 'assets/2d/Meshy_AI_robot-fire-extract.png',
        description:
          "Son cœur de fusion chauffe à blanc. Quand Pyrobot s'énerve, des étincelles jaillissent de ses articulations."
      },
      {
        id: 3,
        name: 'Robotruffe',
        types: ['plant'],
        image: 'assets/2d/Meshy_AI_robot-plant-extract.png',
        description:
          "Recouvert de lianes recyclées, ce monstre végétal recharge ses batteries grâce à la photosynthèse."
      },
      {
        id: 4,
        name: 'Hydrobot',
        types: ['water'],
        image: 'assets/2d/Meshy_AI_robot-water-extract.png',
        description:
          "Ses circuits sont refroidis par un flux d'eau continu. Hydrobot transforme l'humidité de l'air en carburant."
      }
    ]

    const grid = document.getElementById('grid')
    const overlay = document.getElementById('overlay')

    function typeBadges(types) {
      return types
        .map((t) => `<span class="type-badge" style="background:${TYPE_COLORS[t]}">${t}</span>`)
        .join('')
    }

    function renderGrid() {
      grid.innerHTML = robots
        .map(
          (r) => `
        <button class="card" onclick="openDetail(${r.id})">
          <div class="card-image" style="background: radial-gradient(circle at 30% 30%, ${TYPE_COLORS[r.types[0]]}55, #151a24 70%)">
            <img src="${r.image}" alt="${r.name}" />
            <span class="card-id">n°${String(r.id).padStart(3, '0')}</span>
          </div>
          <div class="card-body">
            <h3>${r.name}</h3>
            <div class="types">${typeBadges(r.types)}</div>
          </div>
        </button>`
        )
        .join('')
    }

    function openDetail(id) {
      const r = robots.find((x) => x.id === id)
      if (!r) return
      document.getElementById('detailImage').innerHTML = `
        <img src="${r.image}" alt="${r.name}" />
      `
      document.getElementById('detailImage').style.background =
        `radial-gradient(circle at 30% 30%, ${TYPE_COLORS[r.types[0]]}55, #10151d 75%)`
      document.getElementById('detailBody').innerHTML = `
        <span class="card-id">n°${String(r.id).padStart(3, '0')}</span>
        <h2>${r.name}</h2>
        <div class="types">${typeBadges(r.types)}</div>
        <p class="detail-desc">${r.description}</p>
        <ul class="detail-stats">
          <li><span>Énergie</span><strong>100</strong></li>
          <li><span>Attaque</span><strong>65</strong></li>
          <li><span>Défense</span><strong>60</strong></li>
          <li><span>Vitesse</span><strong>80</strong></li>
        </ul>
        <div class="detail-nav">
          <button class="btn btn-ghost" onclick="closeDetail()">← Retour</button>
          <button class="btn" style="background:${TYPE_COLORS[r.types[0]]}" onclick="closeDetail()">Voir tous les robots →</button>
        </div>
      `
      overlay.classList.add('open')
    }

    function closeDetail() {
      overlay.classList.remove('open')
    }

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeDetail()
    })

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeDetail()
    })

    renderGrid()
  </script>
</body>
</html>
